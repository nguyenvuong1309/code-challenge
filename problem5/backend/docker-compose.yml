version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mining_user:mining_pass@postgres:5432/mining_game
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
    networks:
      - mining-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mining_game
      - POSTGRES_USER=mining_user
      - POSTGRES_PASSWORD=mining_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mining-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mining-network

volumes:
  postgres_data:
  redis_data:

networks:
  mining-network:
    driver: bridge